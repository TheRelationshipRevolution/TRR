<style>
:root{
  --bg:#1E1E20; --card:#272729; --card-2:#2F2F31;
  --rose:#C49080; --rose-light:#D4A898; --rose-dark:#8C5C50;
  --cream:#F0E8E0; --grey:#8A8078; --border:#3A3A3C;
  --paper:#EFE7DC; --paper-2:#E7DCCE; --ink:#26221F;
  --metal:linear-gradient(135deg,#8C5C50 0%,#D4A898 35%,#D4A898 55%,#8C5C50 100%);
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:22px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;
  color:var(--cream);
  background:#1E1E20;
  min-height:100vh;
}
#root{min-height:100vh;}
.app{
  min-height:100vh;
  background:#1e1e20;
  position:relative;
}
.wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:0 20px 80px;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  backdrop-filter:blur(8px);
  background:rgba(30,30,32,0.72);
  border-bottom:1px solid var(--border);
}
.progressbar{height:3px; width:100%; background:var(--border);}
.progressbar > div{height:100%; background:linear-gradient(90deg,#8C5C50,#D4A898); transition:width .6s ease;}
.topbar-inner{max-width:1080px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
.brand .bn{font-family:'DM Sans'; font-weight:400; font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--rose-light);}
.navbtns{display:flex; gap:8px; align-items:center;}

/* ---------- buttons ---------- */
.btn{font-family:'DM Sans'; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; border-radius:var(--r-md); padding:11px 20px; cursor:pointer; border:none; transition:transform .15s ease, box-shadow .25s ease, opacity .2s; font-weight:500;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:linear-gradient(135deg,#8C5C50,#D4A898,#8C5C50); color:#241a16; box-shadow:0 6px 18px rgba(140,92,80,.35);}
.btn-primary:hover{box-shadow:0 8px 24px rgba(196,144,128,.45);}
.btn-ghost{background:transparent; border:1px solid var(--border); color:var(--grey);}
.btn-ghost:hover{border-color:var(--rose); color:var(--rose-light);}
.btn-ghost.on{border-color:var(--rose); color:var(--rose-light); background:rgba(196,144,128,.10);}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn-lg{padding:15px 34px; font-size:12.5px;}

/* ---------- ornament ---------- */
.orn{display:flex; align-items:center; justify-content:center; gap:12px; margin:10px auto;}
.orn-line{height:1px; width:70px;}
.orn-line.l{background:linear-gradient(90deg,transparent,var(--rose));}
.orn-line.r{background:linear-gradient(90deg,var(--rose),transparent);}
.label{font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:var(--rose); font-weight:500;}

/* ---------- welcome ---------- */
.welcome-logo{display:block; width:min(320px,74%); height:auto; margin:0 auto 46px;}
.brand-logo{width:210px; max-width:46vw; height:auto; display:block;}
.welcome{max-width:640px; margin:0 auto; text-align:center; min-height:calc(100vh - 30px); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6vh 4px;}
.welcome .mark{font-family:'DM Sans'; font-size:12px; letter-spacing:.34em; text-transform:uppercase; color:var(--rose); margin-bottom:26px;}
.welcome h1{font-family:'Cormorant Garamond'; font-weight:400; letter-spacing:.02em; line-height:1; margin:0;}
.welcome h1 .l1{display:block; font-size:34px; color:var(--cream); letter-spacing:.14em;}
.welcome h1 .l2{display:block; font-size:74px; color:transparent; background:var(--metal); -webkit-background-clip:text; background-clip:text; letter-spacing:.06em; margin:2px 0;}
.welcome h1 .l3{display:block; font-size:26px; color:var(--cream); letter-spacing:.42em;}
.welcome .orn{margin-top:20px;}
.welcome .lede{font-family:'Cormorant Garamond'; font-style:italic; font-weight:300; font-size:20px; line-height:1.7; color:#cbbfb4; margin:46px auto 8px; max-width:520px;}
.intent{list-style:none; padding:0; margin:44px auto 48px; width:470px; max-width:100%; text-align:left;}
.intent li{display:flex; gap:14px; align-items:flex-start; padding:15px 0; border-bottom:1px solid rgba(58,58,60,.6); font-size:14px; color:#c3b8ad; font-weight:300; line-height:1.5;}
.intent li:last-child{border-bottom:none;}
.intent .dot{flex:0 0 auto; width:7px; height:7px; margin-top:7px; transform:rotate(45deg); background:var(--rose);}

/* ---------- section header ---------- */
.sec-head{text-align:center; padding:42px 0 12px;}
.sec-eyebrow{font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--grey); font-weight:500; display:block; margin-bottom:18px;}
.sec-title{font-family:'Cormorant Garamond'; font-weight:400; font-size:40px; color:var(--cream); letter-spacing:.02em; margin:0 0 14px;}
.sec-desc{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--rose); font-weight:500;}
.sec-instruct{font-family:'Cormorant Garamond'; font-style:italic; font-size:18px; color:#b7aca1; font-weight:300; margin-top:30px;}

/* ---------- card core ---------- */
.card{
  position:relative; border-radius:16px;
  box-shadow:0 20px 30px rgba(0,0,0,0.5);
  overflow:hidden; user-select:none;
}
/* BACK */
.card-back{
  background:#242427;
  color:var(--rose-light);
}
.card-back .frame-out{position:absolute; inset:4.2%; border-radius:4.6%; border:1px solid rgba(196,144,128,0.30);}
.card-front .frame-out{position:absolute; inset:4.2%; border-radius:4.6%; border:1px solid rgba(196,144,128,0.42);}
.card-back .frame-in{display:none;}
.card-front .frame-in{display:block; position:absolute; inset:7.2%; border-radius:4%; border:1px solid rgba(196,144,128,0.20);}
.cb-content{position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:16% 15%; text-align:center;}
.cb-deck{font-family:'DM Sans'; font-weight:400; letter-spacing:.24em; text-transform:uppercase; color:var(--rose); }
.cb-mid{display:flex; flex-direction:column; align-items:center; gap:9%; width:100%;}
.cb-sectitle{font-family:'Cormorant Garamond'; font-weight:500; letter-spacing:.14em; text-transform:uppercase;
  color:transparent; background:var(--metal); -webkit-background-clip:text; background-clip:text; line-height:1.05;}
.cb-words{font-family:'DM Sans'; font-weight:400; letter-spacing:.22em; text-transform:uppercase; color:var(--rose);}
.cb-brand{font-family:'Cormorant Garamond'; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--rose);
  display:flex; align-items:center; justify-content:center; gap:.4em;}

/* FRONT */
.card-front{
  background:#efe7d9;
  color:var(--ink);
}
.cf-content{position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:16% 14%; text-align:center;}
.cf-deck{font-family:'DM Sans'; font-weight:500; letter-spacing:.24em; text-transform:uppercase; color:#a06f5f;}
.cf-sec{font-family:'DM Sans'; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:#9a6656;}
.cf-mid{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7%; flex:1; width:100%; padding:6% 0;}
.cf-q{font-family:'Cormorant Garamond'; font-weight:500; color:#241f1c; line-height:1.14; letter-spacing:.005em;}
.cf-take{font-family:'Cormorant Garamond'; font-style:italic; font-weight:400; color:#8c5c50;}
.cf-brand{font-family:'Cormorant Garamond'; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:#8c5c50;
  display:flex; align-items:center; justify-content:center; gap:.4em;}

/* divider heart line inside card */
.cdiv{display:flex; align-items:center; justify-content:center; gap:10px; width:78%;}
.cdiv .ln{height:1px; flex:1;}
.card-back .cdiv .ln{background:linear-gradient(90deg,transparent,rgba(196,144,128,.6),transparent);}
.card-front .cdiv .ln{background:linear-gradient(90deg,transparent,rgba(140,92,80,.5),transparent);}

/* ---------- deck fan / selection ---------- */
.stage{position:relative; z-index:1;}
.fan-wrap{position:relative; margin:16px auto 0; display:flex; justify-content:center; align-items:flex-end; min-height:360px; padding:34px 0 10px;}
.fan{position:relative; width:100%; display:flex; justify-content:center; align-items:flex-end;}
.fan-card{position:absolute; bottom:0; transition:transform .28s cubic-bezier(.2,.8,.25,1), opacity .5s ease, filter .3s; cursor:pointer; transform-origin:bottom center;}
.fan-card:hover{z-index:60 !important;}
.fan-lift{transition:transform .22s cubic-bezier(.2,.8,.25,1);}
.fan-card:hover .fan-lift{transform:translateY(-22px);}
.fan-card.dim{opacity:0; pointer-events:none; transform:translateY(30px) scale(.9) !important;}
.pick-count{text-align:center; margin-top:6px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey);}
.pick-count b{color:var(--rose-light); font-weight:500;}

/* ---------- tray ---------- */
.tray{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding:6px 0 4px;}
.tray-play{gap:20px;}
.tray-play .tray-slot{width:150px; height:216px;}
.tray-play .tray-empty span{font-size:22px;}
.tray-slot{width:96px; height:138px; border-radius:12px; display:flex; align-items:center; justify-content:center; position:relative;}
.tray-empty{border:1.4px dashed rgba(196,144,128,.45); background:rgba(196,144,128,.03);}
.tray-empty span{font-family:'Cormorant Garamond'; font-style:italic; color:rgba(196,144,128,.5); font-size:15px;}
.tray-card{cursor:pointer; transition:transform .2s ease, opacity .3s ease; border-radius:12px;}
.tray-card:hover{transform:translateY(-6px);}
.tray-card.focus{transform:translateY(-6px);}
/* mini card backs: clean, no outer halo/box */
.tray-slot .card{box-shadow:none !important;}
.tray-card.done{opacity:.4; cursor:default;}
.tray-card.done:hover{transform:none;}
.tray-card.skip{opacity:.4; cursor:default;}
.tinylabel{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey);}

/* ---------- center stage flip ---------- */
.centerstage{display:flex; flex-direction:column; align-items:center; margin-top:44px;}
.flip{width:320px; height:460px; perspective:1600px; cursor:pointer;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .8s cubic-bezier(.2,.7,.2,1); transform-style:preserve-3d;}
.flip.revealed .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px;}
.flip-back{transform:rotateY(180deg);}
.hint{font-family:'Cormorant Garamond'; font-style:italic; color:var(--grey); font-size:15px; margin-top:16px; min-height:22px;}
.action-row{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; justify-content:center;}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; z-index:80; background:rgba(15,15,17,.72); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; animation:fade .3s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
.modal{background:#272729; border:1px solid var(--border); border-radius:20px; max-width:440px; width:100%; padding:34px 30px; text-align:center; box-shadow:0 30px 60px rgba(0,0,0,.6);}
.modal.wide{max-width:520px;}
.modal h3{font-family:'Cormorant Garamond'; font-weight:400; font-size:28px; color:var(--cream); margin:8px 0 4px;}
.modal p{font-size:13.5px; color:#b7aca1; font-weight:300; line-height:1.6; margin:6px 0 22px;}
.modal-actions{display:flex; flex-direction:column; gap:10px;}

/* ---------- journey ---------- */
.j-summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin:22px 0 10px;}
.j-stat{background:#272729; border:1px solid var(--border); border-radius:14px; padding:18px 16px; text-align:center;}
.j-stat .num{font-family:'Cormorant Garamond'; font-weight:400; font-size:34px; color:var(--rose-light); line-height:1;}
.j-stat .cap{font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--grey); margin-top:8px; font-weight:500;}
.j-list{margin-top:20px; display:flex; flex-direction:column; gap:10px;}
.j-entry{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; transition:border-color .2s;}
.j-entry:hover{border-color:rgba(196,144,128,.4);}
.j-entry.revisit{margin-left:22px; border-left:2px solid var(--rose-dark); background:rgba(39,39,41,.6);}
.j-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
.j-sec{font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--rose); font-weight:500;}
.j-time{font-size:11px; color:var(--grey); font-weight:300;}
.j-q{font-family:'Cormorant Garamond'; font-weight:400; font-size:19px; color:var(--cream); line-height:1.3; margin:8px 0 12px;}
.j-redisc{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--rose-light); background:none; border:none; cursor:pointer; padding:0; font-family:'DM Sans'; display:inline-flex; align-items:center; gap:6px; font-weight:500;}
.j-redisc:hover{color:var(--rose);}
.j-empty{text-align:center; padding:60px 20px; color:var(--grey); font-family:'Cormorant Garamond'; font-style:italic; font-size:18px;}
.j-revlabel{font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--rose-dark); font-weight:600; margin-bottom:6px;}

/* ---------- section rail ---------- */
.rail{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0 4px;}
.rail-chip{font-size:10px; letter-spacing:.12em; text-transform:uppercase; padding:7px 13px; border-radius:20px; border:1px solid var(--border); color:var(--grey); font-weight:500; display:flex; align-items:center; gap:6px;}
.rail-chip.active{border-color:var(--rose); color:var(--rose-light); background:rgba(196,144,128,.1);}
.rail-chip.locked{opacity:.4;}
.rail-chip.done-sec{color:var(--rose); border-color:rgba(196,144,128,.35);}
.lock-i{width:9px; height:9px; opacity:.7;}

.footer-orn{margin:56px auto 10px; opacity:.7;}
.small-note{text-align:center; font-size:11px; color:var(--grey); font-weight:300; margin-top:22px; font-style:italic; font-family:'Cormorant Garamond';}
@media(max-width:520px){
  .welcome h1 .l2{font-size:56px;}
  .flip{width:280px; height:404px;}
  .sec-title{font-size:32px;}
}

/* ---------- membership gate ---------- */
.lock-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.lock-box{max-width:400px; width:100%; text-align:center;}
.lock-box .lock-logo{display:block; width:min(300px,74%); height:auto; margin:0 auto 30px;}
.lock-box h2{font-family:'Cormorant Garamond'; font-weight:400; font-size:26px; color:var(--cream); margin:0 0 10px; letter-spacing:.02em;}
.lock-box p{font-size:13px; color:var(--grey); font-weight:300; line-height:1.6; margin:0 auto 24px; max-width:330px;}
.lock-box input{width:100%; background:rgba(30,30,32,0.8); border:1px solid var(--border); border-radius:10px; color:var(--cream); font-family:'DM Sans'; font-size:14px; padding:13px 14px; margin-bottom:12px;}
.lock-box input:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px rgba(196,144,128,.1);}
.lock-error{color:var(--rose-light); font-size:12.5px; margin-top:12px; line-height:1.5; display:none;}
.lock-join{margin-top:22px; font-size:12.5px; color:var(--grey); font-weight:300;}
.lock-join a{color:var(--rose-light); text-decoration:none;}
.lock-join a:hover{color:var(--rose);}
</style>
</head>

<script>
(function(){
  var WORKER_URL = 'https://wispy-dust-5244.djmisschief.workers.dev';
  var lockWrap = document.getElementById('lockWrap');
  var rootEl   = document.getElementById('root');
  var emailEl  = document.getElementById('lockEmail');
  var errEl    = document.getElementById('lockError');
  var btn      = document.getElementById('lockBtn');

  function grant(email){
    window.__TAC_EMAIL__ = email;
    lockWrap.style.display = 'none';
    rootEl.style.display = 'block';
    if (typeof window.__mountConnectionDeck === 'function') window.__mountConnectionDeck();
  }

  function verify(email, onFail){
    return fetch(WORKER_URL + '/check-access', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }).then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.active) { grant(email); }
        else if (onFail) { onFail(false); }
      })
      .catch(function(){ if (onFail) onFail(true); });
  }

  function checkAccess(){
    var email = (emailEl.value || '').trim().toLowerCase();
    if (!email) return;
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Checking...';
    verify(email, function(networkErr){
      btn.disabled = false; btn.textContent = 'Enter';
      errEl.textContent = networkErr
        ? 'Could not reach the member check right now. Please try again in a moment.'
        : "We couldn't verify that email. Double check it, or reach out if you think this is a mistake.";
      errEl.style.display = 'block';
    }).then(function(){
      if (window.__TAC_EMAIL__) localStorage.setItem('tac_email', window.__TAC_EMAIL__);
    });
  }

  function tryAutoLogin(){
    var saved = null;
    try { saved = localStorage.getItem('tac_email'); } catch(e){}
    if (!saved) return;
    emailEl.value = saved;
    verify(saved.toLowerCase());
  }

  btn.addEventListener('click', checkAccess);
  emailEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') checkAccess(); });
  tryAutoLogin();
})();
</script>
